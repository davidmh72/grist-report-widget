<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grist Report Writer</title>
    <!-- Grist Plugin API -->
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <!-- Template engine -->
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <!-- Maps -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <!-- QR Codes -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
    <!-- Barcodes -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <!-- Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Screenshot for print -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; color: #333; background: #fff; }
        .report-picker { max-width: 640px; margin: 24px auto; }
        .report-picker h2 { font-size: 18px; margin-bottom: 16px; color: #555; }
        .table-group { margin-bottom: 20px; }
        .table-group-title { font-size: 12px; font-weight: 600; color: #16b378; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #e8e8e8; }
        .report-card { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 6px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
        .report-card:hover { border-color: #16b378; box-shadow: 0 2px 8px rgba(22,179,120,0.12); }
        .report-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
        .report-card p { font-size: 11px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
        .report-card .mode-badge { font-size: 10px; padding: 3px 8px; border-radius: 4px; background: #f0f0f0; color: #555; text-transform: uppercase; font-weight: 600; white-space: nowrap; }
        .report-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #eee; flex-wrap: wrap; }
        .report-toolbar button { padding: 6px 14px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; }
        .report-toolbar button:hover { background: #f5f5f5; }
        .report-toolbar .btn-print { background: #16b378; color: #fff; border-color: #16b378; }
        .report-toolbar .btn-print:hover { background: #12956a; }
        .report-toolbar .btn-excel { background: #264653; color: #fff; border-color: #264653; }
        .report-toolbar .btn-excel:hover { background: #1a3540; }
        .report-toolbar h3 { font-size: 14px; flex: 1; }
        .report-loading { text-align: center; padding: 40px; color: #999; }
        .report-error { text-align: center; padding: 40px; color: #e53935; font-size: 13px; }
        .filter-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 9000; display: flex; align-items: center; justify-content: center; }
        .filter-dialog { background: #fff; border-radius: 12px; padding: 24px; width: 90%; max-width: 480px; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .filter-dialog h2 { font-size: 16px; margin-bottom: 16px; color: #333; }
        .filter-group { margin-bottom: 16px; }
        .filter-group label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 6px; }
        .filter-choices { display: flex; flex-wrap: wrap; gap: 4px; max-height: 120px; overflow-y: auto; padding: 4px; border: 1px solid #eee; border-radius: 6px; }
        .filter-choice { display: flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 8px; border-radius: 4px; background: #f8f8f8; cursor: pointer; user-select: none; }
        .filter-choice input { margin: 0; }
        .filter-choice:hover { background: #e8f5e9; }
        .filter-date-range, .filter-number-range { display: flex; gap: 8px; align-items: center; }
        .filter-date-range input, .filter-number-range input { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; width: 140px; }
        .filter-text input { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; width: 100%; }
        .filter-boolean { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .filter-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #eee; }
        .filter-actions button { padding: 8px 20px; border-radius: 6px; border: 1px solid #ddd; font-size: 12px; cursor: pointer; }
        .filter-actions .btn-generate { background: #16b378; color: #fff; border-color: #16b378; font-weight: 600; }
        .filter-actions .btn-generate:hover { background: #12956a; }
        @media print { .report-toolbar { display: none !important; } body { padding: 0; } }
        @media print {
            @page { margin: 15mm; }
            body { background: #fff !important; }
            .report-content { padding: 0; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .card, .kpi, .kpi-card, .chart-box, .chart-card, .chart-panel,
            .panel, .map-card, [data-map], .table-card, .section {
                page-break-inside: avoid;
                break-inside: avoid;
            }
            thead { display: table-header-group; }
            tr { page-break-inside: avoid; break-inside: avoid; }
            canvas { max-width: 100% !important; }
            [data-map] { height: 400px !important; }
            .dashboard, .report, .chart-grid, .chart-row, .kpi-row, .kpi-strip, .metrics, .panels, .summary-grid {
                gap: 12px !important;
            }
            a[href]:after { content: " (" attr(href) ")"; font-size: 9px; color: #666; }
            a[href^="mailto:"]:after { content: none; }
            img[data-asset] + a:after, a:has(img):after { content: none; }
            [data-qr], [data-barcode] { page-break-inside: avoid; break-inside: avoid; }
            .filter-overlay { display: none !important; }
        }
    </style>
</head>
<body>
<div id="app"><div class="report-loading">Connecting to Grist...</div></div>
<script>
(async function() {
    "use strict";
    const REPORTS_TABLE = "SysReports";
    const app = document.getElementById("app");

    // ── Grist Plugin API ──────────────────────────────────────────────────
    grist.ready({ requiredAccess: "full", columns: [] });

    async function fetchTable(tableId) {
        const data = await grist.docApi.fetchTable(tableId);
        const columns = Object.keys(data);
        if (columns.length === 0) return [];
        const rowCount = data.id ? data.id.length : data[columns[0]].length;
        const rows = [];
        for (let i = 0; i < rowCount; i++) {
            const row = {};
            for (const col of columns) row[col] = data[col][i];
            rows.push(row);
        }
        return rows;
    }

    async function resolveAssets(attachmentIds) {
        const assetMap = {};
        if (!attachmentIds || !Array.isArray(attachmentIds)) return assetMap;
        const ids = attachmentIds.filter(id => typeof id === "number");
        for (const attId of ids) {
            try {
                const meta = await grist.docApi.getAttachment(attId);
                const url = await grist.docApi.getAttachmentUrl(attId);
                assetMap[meta.fileName || `attachment_${attId}`] = url;
            } catch(e) { console.warn(`Asset ${attId}:`, e); }
        }
        return assetMap;
    }

    function injectAssets(container, assetMap) {
        container.querySelectorAll("[data-asset]").forEach(el => {
            const fn = el.dataset.asset;
            if (assetMap[fn]) {
                if (el.tagName === "IMG") el.src = assetMap[fn];
                else el.style.backgroundImage = `url(${assetMap[fn]})`;
            }
        });
    }

    // ── Handlebars helpers ─────────────────────────────────────────────────
    const H = Handlebars;
    // Comparison
    H.registerHelper("eq", (a, b) => a === b);
    H.registerHelper("neq", (a, b) => a !== b);
    H.registerHelper("gt", (a, b) => a > b);
    H.registerHelper("lt", (a, b) => a < b);
    H.registerHelper("gte", (a, b) => a >= b);
    H.registerHelper("lte", (a, b) => a <= b);
    H.registerHelper("and", (a, b) => a && b);
    H.registerHelper("or", (a, b) => a || b);
    H.registerHelper("not", (a) => !a);
    // Math
    H.registerHelper("add", (a, b) => Number(a) + Number(b));
    H.registerHelper("subtract", (a, b) => Number(a) - Number(b));
    H.registerHelper("multiply", (a, b) => Number(a) * Number(b));
    H.registerHelper("divide", (a, b) => b !== 0 ? Number(a) / Number(b) : 0);
    H.registerHelper("percent", (a, b) => b !== 0 ? ((a / b) * 100).toFixed(1) + "%" : "0%");
    H.registerHelper("round", (n, d) => Number(n).toFixed(typeof d === "number" ? d : 0));
    // Aggregation
    H.registerHelper("count", (arr) => Array.isArray(arr) ? arr.length : 0);
    H.registerHelper("sum", function(arr, key) { if (!Array.isArray(arr)) return 0; return arr.reduce((s, i) => s + (Number(i[key]) || 0), 0); });
    H.registerHelper("avg", function(arr, key) { if (!Array.isArray(arr) || !arr.length) return 0; return (arr.reduce((s, i) => s + (Number(i[key]) || 0), 0) / arr.length).toFixed(1); });
    H.registerHelper("max", function(arr, key) { if (!Array.isArray(arr) || !arr.length) return 0; return Math.max(...arr.map(i => Number(i[key]) || 0)); });
    H.registerHelper("min", function(arr, key) { if (!Array.isArray(arr) || !arr.length) return 0; return Math.min(...arr.map(i => Number(i[key]) || 0)); });
    H.registerHelper("unique", function(arr, key) { if (!Array.isArray(arr)) return []; return [...new Set(arr.map(i => i[key]).filter(Boolean))]; });
    // Grouping & filtering
    H.registerHelper("groupBy", function(arr, key, options) { if (!Array.isArray(arr)) return ""; const g = {}; arr.forEach(i => { const k = i[key] || "(blank)"; if (!g[k]) g[k] = []; g[k].push(i); }); let o = ""; for (const [k, items] of Object.entries(g)) o += options.fn({ key: k, items, count: items.length }); return o; });
    H.registerHelper("filterBy", function(arr, key, value, options) { if (!Array.isArray(arr)) return ""; const f = arr.filter(i => i[key] === value); return options.fn({ items: f, count: f.length }); });
    H.registerHelper("sortBy", function(arr, key, dir) { if (!Array.isArray(arr)) return []; const s = [...arr].sort((a, b) => a[key] < b[key] ? -1 : a[key] > b[key] ? 1 : 0); return dir === "desc" ? s.reverse() : s; });
    // Dates
    H.registerHelper("formatDate", (val) => { if (!val) return ""; return new Date(val * 1000).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }); });
    H.registerHelper("formatDateTime", (val) => { if (!val) return ""; const d = new Date(val * 1000); return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) + " " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); });
    H.registerHelper("now", () => new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }));
    H.registerHelper("year", (val) => val ? new Date(val * 1000).getFullYear() : new Date().getFullYear());
    H.registerHelper("month", (val) => val ? new Date(val * 1000).getMonth() : new Date().getMonth());
    H.registerHelper("dayOfWeek", (val) => { const d = new Date(val * 1000); return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]; });
    // Strings
    H.registerHelper("uppercase", (s) => String(s || "").toUpperCase());
    H.registerHelper("lowercase", (s) => String(s || "").toLowerCase());
    H.registerHelper("truncate", (s, len) => { const str = String(s || ""); return str.length > len ? str.slice(0, len) + "..." : str; });
    H.registerHelper("replace", (s, find, rep) => String(s || "").replace(new RegExp(find, "g"), rep));
    H.registerHelper("json", (obj) => JSON.stringify(obj));
    // Layout
    H.registerHelper("pageBreak", () => new H.SafeString('<div style="page-break-after: always;"></div>'));
    H.registerHelper("columns", function(count, options) { return new H.SafeString(`<div style="column-count:${count}; column-gap:16px;">${options.fn(this)}</div>`); });
    // Calendar helpers
    H.registerHelper("monthGrid", function(year, month, options) {
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const weeks = [];
        let day = 1 - firstDay;
        for (let w = 0; w < 6; w++) {
            const week = [];
            for (let d = 0; d < 7; d++, day++) {
                week.push(day > 0 && day <= daysInMonth ? day : null);
            }
            if (week.some(d => d !== null)) weeks.push(week);
        }
        let out = "";
        weeks.forEach(week => { out += options.fn({ days: week }); });
        return out;
    });
    H.registerHelper("monthName", (m) => ["January","February","March","April","May","June","July","August","September","October","November","December"][m] || "");

    // ── Additional helpers (visual & formatting) ─────────────────────────────
    H.registerHelper("progressBar", function(value, max) {
        const pct = max > 0 ? Math.min(100, Math.round((value / max) * 100)) : 0;
        return new H.SafeString(`<div style="background:#eee;border-radius:4px;height:8px;width:100%;overflow:hidden;"><div style="background:#16b378;height:100%;width:${pct}%;border-radius:4px;"></div></div>`);
    });
    H.registerHelper("stars", function(value, max) {
        const m = max || 5; const v = Math.round(Number(value) || 0);
        let s = ""; for (let i = 1; i <= m; i++) s += i <= v ? "★" : "☆";
        return new H.SafeString(`<span style="color:#f4a261;letter-spacing:1px;">${s}</span>`);
    });
    H.registerHelper("colourScale", function(value, min, max) {
        const ratio = max > min ? Math.max(0, Math.min(1, (value - min) / (max - min))) : 0;
        const r = Math.round(255 * ratio), g = Math.round(255 * (1 - ratio));
        return new H.SafeString(`<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:rgb(${r},${g},80);"></span>`);
    });
    H.registerHelper("initials", function(name) {
        const parts = String(name || "").split(" ").filter(Boolean);
        const ini = parts.map(p => p[0]).join("").toUpperCase().slice(0, 2);
        const colours = ["#16b378","#e63946","#457b9d","#f4a261","#6a4c93","#2a9d8f","#e76f51","#264653"];
        const colour = colours[ini.charCodeAt(0) % colours.length];
        return new H.SafeString(`<span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:${colour};color:#fff;font-size:11px;font-weight:700;">${ini}</span>`);
    });
    H.registerHelper("timeAgo", function(timestamp) {
        if (!timestamp) return "";
        const now = Date.now() / 1000; const diff = now - timestamp;
        if (diff < 60) return "just now";
        if (diff < 3600) return Math.floor(diff / 60) + " min ago";
        if (diff < 86400) return Math.floor(diff / 3600) + " hours ago";
        if (diff < 2592000) return Math.floor(diff / 86400) + " days ago";
        if (diff < 31536000) return Math.floor(diff / 2592000) + " months ago";
        return Math.floor(diff / 31536000) + " years ago";
    });
    H.registerHelper("formatNumber", function(n) {
        return Number(n || 0).toLocaleString("en-GB");
    });
    H.registerHelper("currency", function(value, code) {
        const c = code || "GBP";
        try { return Number(value || 0).toLocaleString("en-GB", { style: "currency", currency: c }); }
        catch(e) { return Number(value || 0).toFixed(2); }
    });
    H.registerHelper("signatureLine", function(label) {
        return new H.SafeString(`<div style="margin-top:40px;padding-top:8px;border-top:1px solid #333;width:250px;font-size:11px;color:#666;">${label || "Signature"}</div>`);
    });
    H.registerHelper("watermark", function(text) {
        return new H.SafeString(`<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-35deg);font-size:80px;font-weight:700;color:rgba(0,0,0,0.04);pointer-events:none;z-index:0;white-space:nowrap;">${text || "DRAFT"}</div>`);
    });
    H.registerHelper("labels", function(cols, options) {
        const c = Number(cols) || 3;
        return new H.SafeString(`<div style="display:grid;grid-template-columns:repeat(${c},1fr);gap:8px;">${options.fn(this)}</div>`);
    });

    // ── Rendering: Charts ──────────────────────────────────────────────────
    const COLOURS = ["#16b378","#e63946","#457b9d","#f4a261","#6a4c93","#2a9d8f","#e76f51","#264653","#84a98c","#d62828","#003049","#fcbf49"];

    function renderCharts(container, data) {
        container.querySelectorAll("canvas[data-chart]").forEach(canvas => {
            try { new Chart(canvas, JSON.parse(canvas.dataset.chart)); } catch(e) { console.error("Chart:", e); }
        });
        container.querySelectorAll("canvas[data-chart-type]").forEach(canvas => {
            try {
                const type = canvas.dataset.chartType, tableData = data[canvas.dataset.chartTable];
                const groupField = canvas.dataset.chartGroup, labelField = canvas.dataset.chartLabel;
                const valueField = canvas.dataset.chartValue, title = canvas.dataset.chartTitle || "";
                if (!Array.isArray(tableData)) return;
                let labels, values;
                if (groupField) {
                    const g = {}; tableData.forEach(r => { const k = r[groupField] || "(blank)"; g[k] = (g[k] || 0) + (valueField ? (Number(r[valueField]) || 0) : 1); });
                    labels = Object.keys(g); values = Object.values(g);
                } else { labels = tableData.map(r => r[labelField] || ""); values = tableData.map(r => Number(r[valueField]) || 0); }
                new Chart(canvas, { type, data: { labels, datasets: [{ label: title, data: values, backgroundColor: type === "line" ? COLOURS[0] : labels.map((_, i) => COLOURS[i % COLOURS.length]), borderColor: type === "line" ? COLOURS[0] : undefined, borderWidth: type === "line" ? 2 : 1, fill: false }] }, options: { responsive: true, plugins: { title: { display: !!title, text: title }, legend: { display: type === "pie" || type === "doughnut" } }, scales: (type === "bar" || type === "line") ? { y: { beginAtZero: true } } : undefined } });
            } catch(e) { console.error("Declarative chart:", e); }
        });
    }

    // ── Rendering: Maps ─────────────────────────────────────────────────────
    function renderMaps(container, data) {
        container.querySelectorAll("[data-map]").forEach(el => {
            try {
                const tableData = data[el.dataset.mapTable];
                const latField = el.dataset.mapLat || "Latitude";
                const lngField = el.dataset.mapLng || "Longitude";
                const labelField = el.dataset.mapLabel || "";
                const colourField = el.dataset.mapColour || "";
                const useCluster = el.dataset.mapCluster === "true";
                const useHeat = el.dataset.mapHeat === "true";
                if (!Array.isArray(tableData)) return;

                const points = tableData.filter(r => r[latField] && r[lngField] && r[latField] !== 0);
                if (points.length === 0) { el.innerHTML = "<p style='color:#999;text-align:center;padding:20px;'>No coordinates available</p>"; return; }

                el.style.minHeight = el.style.height || "400px";
                const map = L.map(el).setView([points[0][latField], points[0][lngField]], 3);
                L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);

                if (useHeat) {
                    // Heatmap mode
                    const heatPoints = points.map(r => [Number(r[latField]), Number(r[lngField]), 1]);
                    L.heatLayer(heatPoints, { radius: 20, blur: 15, maxZoom: 10 }).addTo(map);
                } else {
                    // Marker mode (with optional clustering)
                    const colourMap = {};
                    let colourIdx = 0;
                    const markerLayer = useCluster ? L.markerClusterGroup() : L.layerGroup();

                    points.forEach(r => {
                        const lat = Number(r[latField]), lng = Number(r[lngField]);
                        if (isNaN(lat) || isNaN(lng)) return;
                        let colour = COLOURS[0];
                        if (colourField && r[colourField]) {
                            if (!colourMap[r[colourField]]) colourMap[r[colourField]] = COLOURS[colourIdx++ % COLOURS.length];
                            colour = colourMap[r[colourField]];
                        }
                        const marker = L.circleMarker([lat, lng], { radius: 6, fillColor: colour, color: "#fff", weight: 1, fillOpacity: 0.8 });
                        if (labelField && r[labelField]) marker.bindPopup(String(r[labelField]));
                        markerLayer.addLayer(marker);
                    });

                    map.addLayer(markerLayer);
                }

                // Fit bounds
                const bounds = L.latLngBounds(points.map(r => [r[latField], r[lngField]]));
                map.fitBounds(bounds, { padding: [20, 20] });
            } catch(e) { console.error("Map:", e); }
        });
    }

    // ── Rendering: QR Codes ─────────────────────────────────────────────────
    function renderQRCodes(container) {
        container.querySelectorAll("[data-qr]").forEach(el => {
            try {
                const value = el.dataset.qr;
                const size = parseInt(el.dataset.qrSize) || 128;
                if (!value) return;
                const canvas = document.createElement("canvas");
                QRCode.toCanvas(canvas, value, { width: size, margin: 1 }, (err) => { if (!err) el.appendChild(canvas); });
            } catch(e) { console.error("QR:", e); }
        });
    }

    // ── Rendering: Barcodes ─────────────────────────────────────────────────
    function renderBarcodes(container) {
        container.querySelectorAll("[data-barcode]").forEach(el => {
            try {
                const value = el.dataset.barcode;
                const format = el.dataset.barcodeFormat || "CODE128";
                if (!value) return;
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                el.appendChild(svg);
                JsBarcode(svg, value, { format, height: 40, displayValue: true, fontSize: 12 });
            } catch(e) { console.error("Barcode:", e); }
        });
    }

    // ── Excel Export ─────────────────────────────────────────────────────────
    function exportToExcel(container, reportName) {
        const tables = container.querySelectorAll("table");
        if (tables.length === 0) { alert("No tables found to export"); return; }
        const wb = XLSX.utils.book_new();
        tables.forEach((table, i) => {
            const ws = XLSX.utils.table_to_sheet(table);
            XLSX.utils.book_append_sheet(wb, ws, `Sheet${i + 1}`);
        });
        XLSX.writeFile(wb, `${reportName || "report"}.xlsx`);
    }

    // ── Filter dialog ──────────────────────────────────────────────────────
    function showFilterDialog(report, data) {
        return new Promise((resolve) => {
            let filters;
            try { filters = JSON.parse(report.Filters || "[]"); } catch(e) { filters = []; }
            if (filters.length === 0) { resolve({}); return; }
            const choiceOptions = {};
            filters.forEach(f => { if (f.type === "choice") { const td = data[f.table] || []; choiceOptions[f.field] = [...new Set(td.map(r => r[f.field]).filter(v => v != null && v !== ""))].sort(); } });

            let html = `<div class="filter-overlay" id="filter-overlay"><div class="filter-dialog"><h2>${report.Report_Name} — Filters</h2>`;
            filters.forEach((f, i) => {
                html += `<div class="filter-group"><label>${f.label || f.field}</label>`;
                if (f.type === "choice") { html += `<div class="filter-choices">`; (choiceOptions[f.field] || []).forEach(val => { html += `<label class="filter-choice"><input type="checkbox" data-filter="${i}" value="${val}" checked> ${val}</label>`; }); html += `</div>`; }
                else if (f.type === "date-range") { html += `<div class="filter-date-range"><input type="date" data-filter="${i}" data-bound="from"> <span>to</span> <input type="date" data-filter="${i}" data-bound="to"></div>`; }
                else if (f.type === "number-range") { html += `<div class="filter-number-range"><input type="number" data-filter="${i}" data-bound="from" placeholder="Min"> <span>to</span> <input type="number" data-filter="${i}" data-bound="to" placeholder="Max"></div>`; }
                else if (f.type === "text") { html += `<div class="filter-text"><input type="text" data-filter="${i}" placeholder="Search..."></div>`; }
                else if (f.type === "boolean") { html += `<div class="filter-boolean"><input type="checkbox" data-filter="${i}" checked> Only include matching</div>`; }
                html += `</div>`;
            });
            html += `<div class="filter-actions"><button class="btn-cancel" id="filter-cancel">Cancel</button><button class="btn-generate" id="filter-generate">Generate Report</button></div></div></div>`;

            const container = document.createElement("div"); container.innerHTML = html; document.body.appendChild(container);
            document.getElementById("filter-cancel").onclick = () => { container.remove(); resolve(null); };
            document.getElementById("filter-generate").onclick = () => {
                const result = {};
                filters.forEach((f, i) => {
                    if (f.type === "choice") { const checked = [...container.querySelectorAll(`input[data-filter="${i}"]:checked`)].map(el => el.value); if (checked.length > 0 && checked.length < (choiceOptions[f.field] || []).length) { if (!result[f.table]) result[f.table] = []; result[f.table].push({ field: f.field, type: "choice", values: checked }); } }
                    else if (f.type === "date-range") { const from = container.querySelector(`input[data-filter="${i}"][data-bound="from"]`).value; const to = container.querySelector(`input[data-filter="${i}"][data-bound="to"]`).value; if (from || to) { if (!result[f.table]) result[f.table] = []; result[f.table].push({ field: f.field, type: "date-range", from: from ? new Date(from).getTime() / 1000 : null, to: to ? new Date(to).getTime() / 1000 : null }); } }
                    else if (f.type === "number-range") { const from = container.querySelector(`input[data-filter="${i}"][data-bound="from"]`).value; const to = container.querySelector(`input[data-filter="${i}"][data-bound="to"]`).value; if (from || to) { if (!result[f.table]) result[f.table] = []; result[f.table].push({ field: f.field, type: "number-range", from: from ? Number(from) : null, to: to ? Number(to) : null }); } }
                    else if (f.type === "text") { const val = container.querySelector(`input[data-filter="${i}"]`).value.trim(); if (val) { if (!result[f.table]) result[f.table] = []; result[f.table].push({ field: f.field, type: "text", value: val.toLowerCase() }); } }
                    else if (f.type === "boolean") { const checked = container.querySelector(`input[data-filter="${i}"]`).checked; if (!result[f.table]) result[f.table] = []; result[f.table].push({ field: f.field, type: "boolean", value: checked }); }
                });
                container.remove(); resolve(result);
            };
        });
    }

    function applyFilters(data, filterResult) {
        if (!filterResult || Object.keys(filterResult).length === 0) return data;
        const filtered = { ...data };
        for (const [table, tableFilters] of Object.entries(filterResult)) {
            if (!Array.isArray(filtered[table])) continue;
            filtered[table] = filtered[table].filter(row => tableFilters.every(f => {
                if (f.type === "choice") return f.values.includes(row[f.field]);
                if (f.type === "date-range") { const v = row[f.field]; if (f.from && v < f.from) return false; if (f.to && v > f.to) return false; return true; }
                if (f.type === "number-range") { const v = Number(row[f.field]); if (f.from != null && v < f.from) return false; if (f.to != null && v > f.to) return false; return true; }
                if (f.type === "text") return String(row[f.field] || "").toLowerCase().includes(f.value);
                if (f.type === "boolean") return !!row[f.field] === f.value;
                return true;
            }));
        }
        return filtered;
    }

    // ── Report renderer ────────────────────────────────────────────────────
    async function renderReport(report, selectedRecord) {
        app.innerHTML = `<div class="report-loading">Loading data...</div>`;
        try {
            const mode = (report.Filter_Mode || "all").trim().toLowerCase();
            const targets = report.Data_Tables ? report.Data_Tables.split(",").map(t => t.trim()) : [];
            const primaryTable = report.Link_Table ? report.Link_Table.trim() : targets[0];
            const data = {};
            await Promise.all(targets.map(async (table) => { data[table] = await fetchTable(table); }));

            if (mode === "record") {
                if (!selectedRecord || !selectedRecord.id) { app.innerHTML = `<div class="report-error">Select a record first to run this report.</div>`; return; }
                console.log(`📄 Report Writer: Record mode — selectedRecord.id = ${selectedRecord.id}, primaryTable = ${primaryTable}, rows in table = ${data[primaryTable]?.length}`);
                console.log(`📄 Report Writer: First 3 IDs in ${primaryTable}:`, data[primaryTable]?.slice(0, 3).map(r => r.id));
                if (primaryTable && data[primaryTable]) data[primaryTable] = data[primaryTable].filter(row => row.id === selectedRecord.id);
                console.log(`📄 Report Writer: After filter — ${data[primaryTable]?.length} rows remain`);
                const selectedId = selectedRecord.id;
                for (const table of targets.filter(t => t !== primaryTable)) {
                    if (!data[table] || data[table].length === 0) continue;
                    const refCols = Object.keys(data[table][0] || {}).filter(col => col === primaryTable || col === primaryTable.replace(/s$/, "") || col === primaryTable + "_ID" || col === "Contact" || col === "Organisation");
                    if (refCols.length > 0) data[table] = data[table].filter(row => refCols.some(col => row[col] === selectedId));
                }
                data._selected = selectedRecord;
            } else if (mode === "filtered") {
                let filters; try { filters = JSON.parse(report.Filters || "[]"); } catch(e) { filters = []; }
                if (filters.length > 0) { const fr = await showFilterDialog(report, data); if (fr === null) { showPicker(); return; } Object.assign(data, applyFilters(data, fr)); }
            }

            data._meta = { reportName: report.Report_Name, generatedAt: new Date().toLocaleString("en-GB"), recordCounts: {} };
            for (const [t, rows] of Object.entries(data)) { if (t !== "_meta" && t !== "_selected") data._meta.recordCounts[t] = Array.isArray(rows) ? rows.length : 0; }

            let assetMap = {};
            if (report.Assets) assetMap = await resolveAssets(report.Assets);

            const template = H.compile(report.Template_HTML || "");
            const html = template(data);

            const reportName = report.Report_Name || "Report";
            app.innerHTML = `
                <div class="report-toolbar">
                    <button onclick="showPicker()">← Reports</button>
                    <h3>${reportName}</h3>
                    <button class="btn-print" onclick="window.print()">🖨 Print</button>
                    <button class="btn-excel" onclick="exportToExcel(document.querySelector('.report-content'),'${reportName.replace(/'/g, "")}')">📊 Excel</button>
                </div>
                <div class="report-content">${html}</div>
            `;

            const content = app.querySelector(".report-content");
            injectAssets(content, assetMap);
            renderCharts(content, data);
            renderMaps(content, data);
            renderQRCodes(content);
            renderBarcodes(content);
        } catch(e) {
            app.innerHTML = `<div class="report-error">Error: ${e.message}</div>`;
            console.error("Report error:", e);
        }
    }

    // ── Report picker ────────────────────────────────────────────────────────
    let reports = [];
    let linkedTableId = null;
    let currentRecord = null;

    function showPicker() {
        const visible = linkedTableId ? reports.filter(r => (r.Link_Table || "").trim() === linkedTableId) : reports;
        if (visible.length === 0) { app.innerHTML = `<div class="report-error">No reports available${linkedTableId ? ` for "${linkedTableId}"` : ""}.</div>`; return; }
        if (visible.length === 1 && (visible[0].Filter_Mode || "all").trim() !== "record") { renderReport(visible[0], currentRecord); return; }
        if (visible.length === 1 && currentRecord) { renderReport(visible[0], currentRecord); return; }

        const groups = {};
        visible.forEach(r => { const t = (r.Link_Table || "Other").trim(); if (!groups[t]) groups[t] = []; groups[t].push(r); });

        let html = `<div class="report-picker"><h2>Reports</h2>`;
        for (const [table, items] of Object.entries(groups)) {
            html += `<div class="table-group"><div class="table-group-title">${table}</div>`;
            items.forEach(r => {
                const idx = reports.indexOf(r);
                const mode = (r.Filter_Mode || "all").trim().toLowerCase();
                const needsRecord = mode === "record" && !currentRecord;
                const disabled = needsRecord ? ' style="opacity:0.5;pointer-events:none;"' : '';
                const modeLabel = mode === "record" ? "Record" : mode === "filtered" ? "Filtered" : "All";
                html += `<div class="report-card"${disabled} onclick="selectReport(${idx})"><div><h3>${r.Report_Name || "Untitled"}</h3><p>${r.Description || ""}${needsRecord ? " — <em>Select a record first</em>" : ""}</p></div><span class="mode-badge">${modeLabel}</span></div>`;
            });
            html += `</div>`;
        }
        html += `</div>`;
        app.innerHTML = html;
    }

    window.selectReport = (i) => renderReport(reports[i], currentRecord);
    window.showPicker = showPicker;
    window.exportToExcel = exportToExcel;

    // ── Initialise ──────────────────────────────────────────────────────────
    grist.onRecord((record) => {
        if (record && record.id) {
            currentRecord = record;
            const visible = linkedTableId ? reports.filter(r => (r.Link_Table || "").trim() === linkedTableId) : reports;
            // Auto-render if only one report, OR if a report is currently displayed
            if (visible.length === 1) {
                renderReport(visible[0], currentRecord);
            } else if (document.querySelector('.report-content')) {
                // A report is already showing — find which one and re-render it
                const currentReportName = document.querySelector('.report-toolbar h3')?.textContent;
                const current = reports.find(r => r.Report_Name === currentReportName);
                if (current && (current.Filter_Mode || "all").trim() === "record") {
                    renderReport(current, currentRecord);
                }
            }
        }
    });

    const WIDGET_NAME = "Report Writer";
    const WIDGET_VERSION = "1.0.1";

    async function detectLinkedTable() { try { const t = await grist.selectedTable.getTableId(); if (t) linkedTableId = t; } catch(e) {} }

    console.log(`📄 ${WIDGET_NAME} v${WIDGET_VERSION} loading...`);
    setTimeout(async () => {
        try {
            await detectLinkedTable();
            console.log(`📄 ${WIDGET_NAME}: Linked to "${linkedTableId || 'none'}"`);
            reports = await fetchTable(REPORTS_TABLE);
            reports = reports.filter(r => r.Active === true);
            console.log(`📄 ${WIDGET_NAME}: ${reports.length} reports loaded`);
            showPicker();
        } catch(e) {
            app.innerHTML = `<div class="report-error">Could not load reports: ${e.message}<br><small>${WIDGET_NAME} v${WIDGET_VERSION}<br>Ensure "${REPORTS_TABLE}" table exists with: Report_Name, Description, Link_Table, Data_Tables, Filter_Mode, Template_HTML, Filters, Assets</small></div>`;
        }
    }, 500);

})();
</script>
